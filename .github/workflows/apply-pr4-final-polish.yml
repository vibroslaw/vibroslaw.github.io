name: Apply PR4 final polish patch

on:
  push:
    branches:
      - codex/final-polish-seo-content-accuracy-pass
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-pr4-patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply generated PR4 patch
        shell: bash
        run: |
          cat .codex/pr4-part-*.b64 > .codex/pr4.patch.gz.b64
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, zlib
          data = base64.b64decode(pathlib.Path('.codex/pr4.patch.gz.b64').read_text().strip())
          try:
              patch = gzip.decompress(data)
          except Exception as exc:
              print(f'gzip wrapper failed ({exc}); retrying raw deflate stream')
              patch = zlib.decompress(data[10:-8], -15)
          pathlib.Path('pr4.patch').write_bytes(patch)
          print('patch bytes', len(patch), 'sha256', hashlib.sha256(patch).hexdigest())
          PY
          git apply --reject --whitespace=nowarn pr4.patch || true
          python3 - <<'PY'
          from pathlib import Path
          targets = {
              'for-institutions/pl/index.html',
              'music-works/pl/index.html',
              'pl/index.html',
              'press-recognition/pl/index.html',
              'sitemap.xml',
              'sztab/pl/index.html',
          }
          current = None
          collecting = False
          out = {target: [] for target in targets}
          for line in Path('pr4.patch').read_text(encoding='utf-8').splitlines(True):
              if line.startswith('diff --git '):
                  current = None
                  collecting = False
                  parts = line.strip().split(' ')
                  if len(parts) >= 4 and parts[3].startswith('b/'):
                      candidate = parts[3][2:]
                      if candidate in targets:
                          current = candidate
                  continue
              if current and line.startswith('@@ '):
                  collecting = True
                  continue
              if current and collecting:
                  if line.startswith('diff --git '):
                      current = None
                      collecting = False
                  elif line.startswith('+') and not line.startswith('+++'):
                      out[current].append(line[1:])
          for target, lines in out.items():
              if not lines:
                  raise SystemExit(f'No replacement content extracted for {target}')
              Path(target).write_text(''.join(lines), encoding='utf-8')
          for reject in Path('.').rglob('*.rej'):
              reject.unlink()
          PY
          rm pr4.patch
          rm -rf .codex
          rm .github/workflows/apply-pr4-final-polish.yml

      - name: Commit final polish pass
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Final polish, SEO and content accuracy pass"
          if [ -n "${{ github.head_ref }}" ]; then
            git push origin HEAD:${{ github.head_ref }}
          else
            git push
          fi
