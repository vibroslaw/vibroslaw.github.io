<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" role="img" aria-labelledby="title desc">
  <title id="title">Rap-Ort: Prawda Sumienia — Oświęcim Anniversary Edition Seal</title>
  <desc id="desc">Premium gold commemorative seal for the Oświęcim / MUP edition of the Rap-Ort: Prawda Sumienia participation record.</desc>
  <defs>
    <radialGradient id="innerGlow" cx="50%" cy="43%" r="58%">
      <stop offset="0" stop-color="#fff0bf" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#e7c878" stop-opacity="0.88"/>
      <stop offset="0.72" stop-color="#9f7430" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3f2a0d" stop-opacity="0.96"/>
    </radialGradient>
    <linearGradient id="goldStroke" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff4c7"/>
      <stop offset="0.22" stop-color="#e6c061"/>
      <stop offset="0.5" stop-color="#9e6d25"/>
      <stop offset="0.74" stop-color="#f0d68d"/>
      <stop offset="1" stop-color="#6d4718"/>
    </linearGradient>
    <filter id="softShadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <path id="topArc" d="M 168 600 A 432 432 0 0 1 1032 600"/>
    <path id="bottomArc" d="M 1032 600 A 432 432 0 0 1 168 600"/>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif;}
      .sans{font-family:Arial,Helvetica,sans-serif;}
      .smallcaps{letter-spacing:14px;text-transform:uppercase;}
      .micro{letter-spacing:9px;text-transform:uppercase;}
    </style>
  </defs>

  <circle cx="600" cy="600" r="552" fill="#080604" opacity="0.92" filter="url(#softShadow)"/>
  <circle cx="600" cy="600" r="530" fill="none" stroke="url(#goldStroke)" stroke-width="18"/>
  <circle cx="600" cy="600" r="488" fill="none" stroke="#ead089" stroke-width="3" opacity="0.78"/>
  <circle cx="600" cy="600" r="435" fill="none" stroke="#b98732" stroke-width="8" opacity="0.72"/>
  <circle cx="600" cy="600" r="365" fill="url(#innerGlow)" opacity="0.22"/>
  <circle cx="600" cy="600" r="322" fill="none" stroke="#e7c878" stroke-width="2" opacity="0.5"/>

  <text class="sans micro" font-size="44" font-weight="700" fill="#f3d88e">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">RAP-ORT: PRAWDA SUMIENIA</textPath>
  </text>
  <text class="sans micro" font-size="34" font-weight="700" fill="#d9b767" opacity="0.92">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">OŚWIĘCIM · 25 MAJA 2026</textPath>
  </text>

  <g transform="translate(600 600)">
    <line x1="-245" x2="245" y1="-115" y2="-115" stroke="#d6ae58" stroke-width="3" opacity="0.72"/>
    <line x1="-245" x2="245" y1="115" y2="115" stroke="#d6ae58" stroke-width="3" opacity="0.72"/>
    <text class="serif smallcaps" x="0" y="-32" text-anchor="middle" font-size="56" fill="#fff0bc">ZAPIS</text>
    <text class="serif smallcaps" x="0" y="38" text-anchor="middle" font-size="56" fill="#fff0bc">UCZESTNICTWA</text>
    <text class="sans micro" x="0" y="176" text-anchor="middle" font-size="28" fill="#d7b35f">EDYCJA ROCZNICOWA</text>
    <text class="sans micro" x="0" y="226" text-anchor="middle" font-size="22" fill="#b8944d">MUP · RAP-ORT</text>
  </g>

  <g opacity="0.72" stroke="#d9b767" stroke-width="3" fill="none">
    <path d="M600 122 L617 169 L667 164 L631 199 L647 247 L600 221 L553 247 L569 199 L533 164 L583 169 Z" fill="#d9b767" opacity="0.36"/>
    <path d="M600 1078 L617 1031 L667 1036 L631 1001 L647 953 L600 979 L553 953 L569 1001 L533 1036 L583 1031 Z" fill="#d9b767" opacity="0.36"/>
    <path d="M122 600 L169 583 L164 533 L199 569 L247 553 L221 600 L247 647 L199 631 L164 667 L169 617 Z" fill="#d9b767" opacity="0.26"/>
    <path d="M1078 600 L1031 583 L1036 533 L1001 569 L953 553 L979 600 L953 647 L1001 631 L1036 667 L1031 617 Z" fill="#d9b767" opacity="0.26"/>
  </g>
</svg>
